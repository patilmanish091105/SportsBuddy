<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Sports Buddy password">
    <title>Forgot Password - Sports Buddy</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <div class="nav-brand">
    <a href="./index.html" class="brand-link">
        <h1>⚽ Sports Buddy</h1>
    </a>
</div>

            <div class="nav-links">
                <a href="./login.html">Login</a>
                <a href="./register.html">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="background: linear-gradient(135deg, #2563eb, #1e40af); width: 80px; height: 80px; margin: 0 auto 1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                    🔑
                </div>
                <h2>Forgot Password?</h2>
                <p style="color: var(--text-light);">
                    No worries! Enter your registered email address and we'll send you a password reset link.
                </p>
            </div>

            <div id="loadingIndicator" class="spinner" style="display: none;"></div>

            <div id="alertContainer"></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="your.email@example.com" 
                        required
                        aria-required="true"
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Send Reset Link
                </button>
            </form>

            <p class="auth-link">
                Remembered your password?
                <a href="./login.html">Login here</a>
            </p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sports Buddy. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/forgot-password.js"></script>
</body>
</html>
