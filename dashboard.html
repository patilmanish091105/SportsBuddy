<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and enroll in sports events">
    <title>User Dashboard - Sports Buddy</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <div class="nav-brand">
    <a href="./index.html" class="brand-link">
        <h1>⚽ Sports Buddy</h1>
    </a>
</div>

            <div class="nav-links">
                <span id="userName" style="font-weight: 500; color: var(--text-color);">Welcome</span>
                <a href="./my-events.html" class="btn btn-primary btn-small">
                     My Events
                </a>
                <button id="logoutBtn" class="btn btn-secondary btn-small" aria-label="Logout">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <main class="main-content">
            <div class="section-header">
                <h2>Available Sports Events</h2>

                <div class="filters">
                    <select id="filterSport" aria-label="Filter by sport">
                        <option value="">All Sports</option>
                    </select>

                    <select id="filterCity" aria-label="Filter by city">
                        <option value="">All Cities</option>
                    </select>

                    <select id="filterArea" aria-label="Filter by area">
                        <option value="">All Areas</option>
                    </select>
                </div>
            </div>

            <div id="loadingIndicator" class="spinner" style="display: none;"></div>

            <div id="eventsGrid" class="events-grid" role="list">
            </div>
        </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sports Buddy. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/dashboard.js"></script>
    <script type="module" src="./js/event-enroll.js"></script>
</body>
</html>
