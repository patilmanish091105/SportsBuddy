<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - Sports Buddy Management Portal">
    <title>Admin Login - Sports Buddy</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <div class="nav-brand">
    <a href="./index.html" class="brand-link">
        <h1>⚽ Sports Buddy</h1>
    </a>
</div>

            <div class="nav-links">
                <a href="./index.html">Home</a>
                <a href="./login.html">User Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="background: linear-gradient(135deg, #2563eb, #1e40af); width: 80px; height: 80px; margin: 0 auto 1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                    🔐
                </div>
                <h2>Admin Portal</h2>
                <p style="color: #6b7280;">Secure access for administrators only</p>
            </div>

            <div id="loadingIndicator" class="spinner" style="display: none;"></div>

            <div id="alertContainer"></div>
            
            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@sportsbuddy.com" 
                        required
                        aria-required="true"
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter admin password" 
                        required
                        aria-required="true"
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="alert alert-warning" style="margin-bottom: 1rem;">
                    ⚠️ This area is restricted to authorized administrators only.
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Login as Admin
                </button>
                
                <p class="auth-link" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
                    <a href="./login.html">← Back to User Login</a>
                </p>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sports Buddy. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/logger.js"></script>
    <script type="module" src="./js/admin-auth.js"></script>
</body>
</html>
